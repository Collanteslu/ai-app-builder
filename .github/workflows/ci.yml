name: CI

on:
  push:
    branches: [main, v2, feature/*]
  pull_request:
    branches: [main, v2]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Validación de skills y config del constructor
  # ──────────────────────────────────────────────────────────────────────────
  validate-skills:
    runs-on: ubuntu-latest
    name: Skills — frontmatter + índice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check SKILL.md frontmatter
        run: |
          errors=0
          for skill in skills/*/; do
            name=$(basename "$skill")
            file="${skill}SKILL.md"
            if [ ! -f "$file" ]; then
              echo "❌ $name: SKILL.md no existe"
              errors=$((errors+1))
              continue
            fi
            first=$(grep -m1 -v '^[[:space:]]*$' "$file")
            if [ "$first" != "---" ]; then
              echo "❌ $name: falta frontmatter (la primera línea con contenido debe ser ---)"
              errors=$((errors+1))
            fi
            if ! grep -q "^name:" "$file"; then
              echo "❌ $name: falta campo 'name' en frontmatter"
              errors=$((errors+1))
            fi
            if ! grep -q "^description:" "$file"; then
              echo "❌ $name: falta campo 'description' en frontmatter"
              errors=$((errors+1))
            fi
            actual_name=$(grep "^name:" "$file" | sed 's/^name:[[:space:]]*//')
            if [ "$actual_name" != "$name" ]; then
              echo "❌ $name: name '$actual_name' no coincide con el directorio"
              errors=$((errors+1))
            fi
          done
          if [ $errors -gt 0 ]; then
            echo "---"
            echo "Total de errores: $errors"
            exit 1
          fi
          echo "✓ Todas las skills válidas"

      - name: INDEX.md ↔ skills/ sincronizados
        run: |
          node <<'SCRIPT'
          const fs = require("fs");
          const index = fs.readFileSync("skills/INDEX.md", "utf8");
          const dirs = fs.readdirSync("skills", { withFileTypes: true })
            .filter((d) => d.isDirectory())
            .map((d) => d.name);
          const listed = new Set();
          for (const m of index.matchAll(/^\|\s*`([a-z0-9-]+)`/gim)) listed.add(m[1]);
          const missingInIndex = dirs.filter((d) => !listed.has(d));
          const missingOnDisk = [...listed].filter((n) => !dirs.includes(n));
          let err = 0;
          if (missingInIndex.length) {
            console.error("❌ Skills sin entrada en INDEX.md: " + missingInIndex.join(", "));
            err = 1;
          }
          if (missingOnDisk.length) {
            console.error("❌ INDEX.md lista skills sin directorio: " + missingOnDisk.join(", "));
            err = 1;
          }
          if (!err) console.log("✓ INDEX.md y skills/ sincronizados (" + dirs.length + " skills)");
          process.exit(err);
          SCRIPT

  validate-config:
    runs-on: ubuntu-latest
    name: Config — opencode.json + estructura
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: opencode.json es JSON válido
        run: |
          if [ ! -f opencode.json ]; then
            echo "❌ opencode.json no existe"
            exit 1
          fi
          node -e "JSON.parse(require('fs').readFileSync('opencode.json','utf8'))" \
            && echo "✓ opencode.json es JSON válido" \
            || { echo "❌ opencode.json no es JSON válido"; exit 1; }
      - name: Estructura .opencode presente
        run: |
          for dir in agents instructions commands; do
            if [ ! -d ".opencode/$dir" ]; then
              echo "⚠ .opencode/$dir no existe (opcional)"
            else
              echo "✓ .opencode/$dir presente"
            fi
          done
      - name: Agentes markdown con permission válido
        run: |
          node <<'SCRIPT'
          const fs = require("fs");
          const path = require("path");
          const dir = ".opencode/agents";
          if (!fs.existsSync(dir)) process.exit(0);
          let err = 0;
          for (const f of fs.readdirSync(dir).filter((f) => f.endsWith(".md"))) {
            const content = fs.readFileSync(path.join(dir, f), "utf8");
            if (!content.startsWith("---")) {
              console.error("❌ " + f + ": falta frontmatter");
              err = 1; continue;
            }
            const end = content.indexOf("---", 3);
            const fm = content.slice(3, end);
            if (!/^description:/m.test(fm)) {
              console.error("❌ " + f + ': falta "description" (obligatorio en opencode)');
              err = 1;
            }
          }
          if (!err) console.log("✓ Agentes válidos");
          process.exit(err);
          SCRIPT

  # ──────────────────────────────────────────────────────────────────────────
  # Template: typecheck, lint, build
  # ──────────────────────────────────────────────────────────────────────────
  validate-template:
    runs-on: ubuntu-latest
    name: Template — tsc / lint / build
    defaults:
      run:
        working-directory: template
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: template/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm test:run
      - run: pnpm build

  # ──────────────────────────────────────────────────────────────────────────
  # Gates ejecutables: pasan en verde sobre el template limpio y BLOQUEAN
  # ante un hueco real. Un gate roto que siempre devuelve 0 sería peor que
  # no tener gate.
  # ──────────────────────────────────────────────────────────────────────────
  test-gates:
    runs-on: ubuntu-latest
    name: Gates — bloquean de verdad
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: audit.mjs pasa sobre el template limpio (exit 0)
        working-directory: template
        run: node scripts/audit.mjs
      - name: audit.mjs BLOQUEA un fetch huérfano (exit 1)
        run: |
          fx=$(mktemp -d)
          mkdir -p "$fx/src/app/p"
          printf 'export default function P(){fetch("/api/ghost/x");return null}\n' > "$fx/src/app/p/page.tsx"
          if (cd "$fx" && node "$GITHUB_WORKSPACE/template/scripts/audit.mjs"); then
            echo "❌ audit.mjs NO bloqueó un fetch a endpoint inexistente"; exit 1
          fi
          echo "✓ audit.mjs bloqueó el hueco como se esperaba"
      - name: trace-lint.mjs BLOQUEA un RF sin arquitectura (exit 1)
        run: |
          fx=$(mktemp -d); mkdir -p "$fx/.builder"
          printf '# PRD\n## RF-01 — X · Prioridad: alta\nDado A, Cuando B, Entonces C.\n' > "$fx/.builder/prd.md"
          printf '# Arquitectura\n(sin RF-01)\n' > "$fx/.builder/architecture.md"
          if (cd "$fx" && node "$GITHUB_WORKSPACE/template/scripts/trace-lint.mjs"); then
            echo "❌ trace-lint.mjs NO bloqueó un RF ausente en la arquitectura"; exit 1
          fi
          echo "✓ trace-lint.mjs bloqueó el hueco como se esperaba"

  # ──────────────────────────────────────────────────────────────────────────
  # Lint del repo: scripts Node válidos y markdown no vacío
  # ──────────────────────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    name: Lint — scripts y docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Scripts .mjs del template son Node válido
        run: |
          for script in template/scripts/*.mjs; do
            if [ -f "$script" ]; then
              if ! node --check "$script" 2>&1; then
                echo "❌ $script tiene errores de sintaxis"
                exit 1
              fi
            fi
          done
          echo "✅ Scripts Node válidos"
      - name: Markdown no vacío
        run: |
          for file in config/*.md skills/**/SKILL.md .opencode/**/*.md; do
            if [ -f "$file" ] && [ ! -s "$file" ]; then
              echo "⚠️  $file está vacío"
            fi
          done
          echo "✅ Validación de Markdown completada"

  # ──────────────────────────────────────────────────────────────────────────
  # Instalación: los scripts de bootstrap son sintácticamente válidos
  # ──────────────────────────────────────────────────────────────────────────
  install-test:
    runs-on: ubuntu-latest
    name: Instalación — scripts válidos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Scripts de instalación
        run: |
          [ -f scripts/bootstrap.ps1 ] && echo "✅ bootstrap.ps1 existe"
          if [ -f scripts/install.sh ] && ! bash -n scripts/install.sh 2>&1; then
            echo "❌ install.sh tiene errores"; exit 1
          fi
          [ -f scripts/install.sh ] && echo "✅ install.sh es válido"
      - name: PowerShell scripts válidos (sintaxis)
        shell: pwsh
        run: |
          $errors = 0
          $psScripts = Get-ChildItem -Path scripts -Filter "*.ps1" -Recurse
          foreach ($script in $psScripts) {
            try {
              $null = [System.Management.Automation.PSParser]::Tokenize((Get-Content $script.FullName -Raw), [ref]$null)
              Write-Host "✅ $($script.Name) sintaxis válida"
            } catch {
              Write-Host "❌ $($script.Name) tiene errores: $_"
              $errors++
            }
          }
          if ($errors -gt 0) { exit 1 }
          Write-Host "✅ Todos los scripts PowerShell tienen sintaxis válida"

  # ──────────────────────────────────────────────────────────────────────────
  # Resumen (gate único de cierre)
  # ──────────────────────────────────────────────────────────────────────────
  summary:
    runs-on: ubuntu-latest
    name: "✅ CI completo"
    if: always()
    needs: [validate-skills, validate-config, validate-template, test-gates, lint, install-test]
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.validate-skills.result }}" != "success" ] || \
             [ "${{ needs.validate-config.result }}" != "success" ] || \
             [ "${{ needs.validate-template.result }}" != "success" ] || \
             [ "${{ needs.test-gates.result }}" != "success" ] || \
             [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.install-test.result }}" != "success" ]; then
            echo "❌ CI falló"
            exit 1
          fi
          echo "✅ CI completado exitosamente"
